services:
  simbus-ui:
    build: .
    ports:
      - '4321:4321'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Named volume so device containers (Docker-from-Docker) can bind-mount
      # the same instance YAML the UI writes under /app/data/instances.
      - simbus-data:/app/data
    environment:
      SIMBUS_UI_MODE: docker
      DOCKER_NETWORK: simbus-net
      SIMBUS_INSTANCE_VOLUME: simbus-data
      DATABASE_URL: /app/data/simbus.db
      SIMBUS_IMAGE: ${SIMBUS_IMAGE:-ghcr.io/obsidia-systems/simbus:0.3.0}
    networks:
      - simbus-net
    restart: unless-stopped

volumes:
  simbus-data:
    name: simbus-data

networks:
  simbus-net:
    name: simbus-net
    driver: bridge
